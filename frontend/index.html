<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>RepoLens AI – Intelligent GitHub Repository Analyzer</title>
    <meta
      name="description"
      content="RepoLens AI — Instantly understand any GitHub repository with AI-powered analysis. Get project summaries, tech stack details, health scores, and improvement suggestions in seconds."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0b1e" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RepoLens AI – Intelligent GitHub Repository Analyzer" />
    <meta
      property="og:description"
      content="Paste a GitHub URL and get an AI-generated dashboard — architecture analysis, health scores, security insights, and improvement roadmaps in under a minute."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://repolens.ai" />
    <meta property="og:site_name" content="RepoLens AI" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoLens AI – Intelligent GitHub Repository Analyzer" />
    <meta
      name="twitter:description"
      content="Paste a GitHub URL and get an AI-generated dashboard — architecture analysis, health scores, security insights, and improvement roadmaps."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Preconnect to font origin for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
